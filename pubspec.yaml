name: flutter_cool_morning
description: "Cool morning app"
publish_to: 'none'

version: 1.0.7+7 # when uploading to playstore, do not forget to increase the +x

environment:
  sdk: '>=3.4.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  persistent_bottom_nav_bar_v2: 6.5.0
  #flutter_pdfview: ^1.3.2
  path_provider: 2.1.6
  url_launcher: 6.3.3
  flutter_native_splash: 2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: 6.0.0


flutter:


  uses-material-design: true

  assets:
    - images/

  fonts:
    - family: Gotham
      fonts:
        - asset: fonts/gotham_ultra.otf

    - family: Gothic
      fonts:
        - asset: fonts/GOTHIC.ttf
        - asset: fonts/GOTHICB.ttf